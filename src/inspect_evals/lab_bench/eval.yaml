title: 'LAB-Bench: Measuring Capabilities of Language Models for Biology Research'
description: |
  Tests LLMs and LLM-augmented agents abilities to answer questions on scientific research workflows in domains like chemistry, biology, materials science, as well as more general science tasks
arxiv: https://arxiv.org/abs/2407.10362
group: Safeguards
contributors:
  - matthewreed26
version: "2-A"
tasks:
  - name: lab_bench_litqa
    dataset_samples: 199
  - name: lab_bench_suppqa
    dataset_samples: 82
  - name: lab_bench_figqa
    dataset_samples: 181
  - name: lab_bench_tableqa
    dataset_samples: 244
  - name: lab_bench_dbqa
    dataset_samples: 520
  - name: lab_bench_protocolqa
    dataset_samples: 108
  - name: lab_bench_seqqa
    dataset_samples: 600
  - name: lab_bench_cloning_scenarios
    dataset_samples: 33
  - name: lab_bench_litqa_codetools
    dataset_samples: 199
  - name: lab_bench_suppqa_codetools
    dataset_samples: 82
  - name: lab_bench_figqa_codetools
    dataset_samples: 181
  - name: lab_bench_tableqa_codetools
    dataset_samples: 244
  - name: lab_bench_dbqa_codetools
    dataset_samples: 520
  - name: lab_bench_protocolqa_codetools
    dataset_samples: 108
  - name: lab_bench_seqqa_codetools
    dataset_samples: 600
  - name: lab_bench_cloning_scenarios_codetools
    dataset_samples: 33

external_assets:
  - type: huggingface
    source: futurehouse/lab-bench
    fetch_method: hf_dataset
    state: pinned

metadata:
  # tests/utils/eval_params.py applies eval-level metadata to every task in the
  # eval. fast keeps the task-construction tests in the default pytest suite;
  # those tests build each task without starting the sandbox, and the codetools
  # variants load the same datasets as the stock tasks, so fast is set to true.
  # browse_comp pairs requires_internet and sandbox the same way.
  fast: true
  requires_internet: true
  sandbox:
    - solver
